<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../Page_JS/resto.js"></script>
    <link rel="stylesheet" type="text/css" href="../Page_CSS/commandes.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Page de commandes - Panier</title>
</head>
<body>
    <header>Le headerrrerererererer</header>
    <div id="title">
        <div class="comm">
            <span class="line"></span>
            <span>Commande en ligne</span>
            <span class="line"></span>
        </div>
        <h1>Votre commande</h1>
        <h2>A emporter . prête en 25 minutes . paiement au retrait</h2>
    </div>
    <section style = "width:50%">
        <div style="flex:auto; flex-direction: row;">
            <h3>Votre panier (3 articles)</h3>
            <i class="fa-solid fa-trash-can"></i>
            <p>Vider le panier</p>
        </div>
        <div style="flex: content;">
            <img src="pizza.png" style="height: 50px;"></img>
            <h4>Pizza Margherita DOP</h4>
            <p>CHF 19.00 / pièce</p>
            <button class="button" onclick="plus()">
            <p>+</p>
            </button>
            <p id="num"></p>
            <button class="button" onclick="minus()">
            <p>-</p>
            </button>
        </div>
    </section>
    <footer>Le fouteurueueuueruerue</footer>
</body>
</html>

<script>
    let num = 0;
    function plus() {
    document.getElementById("num").textContent = ++num;
    }
    function minus() {
    document.getElementById("num").textContent = --num;
    }
</script>
